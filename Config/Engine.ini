[/Script/OnlineSocketsSteam.NetDriverSteam]
; UNetDriverSteam derives from UNetDriver rather than UIpNetDriver, and BaseEngine.ini writes every number
; that decides a connection's fate under the IP driver's own section, so none of them are inherited: what
; arrives instead are the C++ defaults, zero for every timeout. A zero timeout drops a connection as soon
; as it stops talking, which the editor hides and a packaged build does not.
;
; The numbers below are the ones the IP driver ships with. A plugin's config is a dynamic layer applied
; after the project's own files, so a project overrides these in Config/PluginOverrideEngine.ini, not in
; its DefaultEngine.ini. Checked against FConfigBranch::AddDynamicLayersToHierarchy on 2026-09-15.
NetConnectionClassName="/Script/OnlineSocketsSteam.NetConnectionSteam"
NetServerMaxTickRate=30
MaxNetTickRate=120

; How long a connection may stay silent: while it is still being established, and once it is up.
InitialConnectTimeout=60.0
ConnectionTimeout=60.0
; Debug and editor builds are slow enough to time out on their own; this multiplies the two above there.
TimeoutMultiplierForUnoptimizedBuilds=1
; How often a connection with nothing to say says so, which is what keeps the two above from expiring.
KeepAliveTime=0.2

; Bandwidth a single client is allowed. The C++ defaults are 15000 and 10000, which is a tenth of what
; the IP driver allows and is shared out per connection by the world's tick.
MaxClientRate=100000
MaxInternetClientRate=100000

; How long an actor stays relevant after it stops being relevant, and how long a freshly spawned one is
; given priority. Both are zero by default, which makes relevancy flap and new actors start unimportant.
RelevantTimeout=5.0
SpawnPrioritySeconds=1.0
; Pause before a server travel, so that what is already queued has time to go out.
ServerTravelPause=4.0
; A client which just disconnected is remembered this long, so its late packets are ignored rather than
; treated as a new connection.
RecentlyDisconnectedTrackingTime=120

; Longest one dispatch may spend reading packets, and how many packets it reads between two checks of that.
; Both have to be set for there to be a budget at all; left at zero, the dispatch reads until the sockets
; are empty, which is what UIpNetDriver does with the same pair.
;MaxSecondsInReceive=0.0
;NbPacketsBetweenReceiveTimeTest=0


; The settings the Steam services themselves read. None are written here: a game names its own app id and
; its own server details, and the rest only matter when the defaults do not suit it. The names below are
; the whole of what is read, so anything else in this section is ignored (see ONLINE_STRUCT_META in
; OnlineServicesSteam.cpp).
[OnlineServices.Steam]
; SteamAppId - the app id this build is; required, and the one setting with no useful default.
; Transport - Sockets (default) or Messages: a connection per peer, or one connectionless channel.
; bUseRelay - True (default) to speak over the Steam Datagram Relay, False to speak to an address. One
;   answer for the host and every client; never inferred from the role or from the destination.
; bUseSteamTransport - whether the relay is brought up at all when the API initializes.
; bInitServerOnClient - whether a client process also brings up the game server API. It says nothing
;   about whether that process may host: over the relay a listen server needs no game server API.
; bRelaunchInSteam, bVACEnabled, bUseSymmetricConnect, bOverrideDefaultSubsystem.
; bAdvertiseServer, ServerName, GameServerQueryPort, ProductName, GameDirectory, GameVersion,
;   GameDescription - what a game server tells the master server and the browser about itself.
; RequestTimeoutSeconds - 4.0; how long a call into Steam beside us may stay unanswered.
; BackendRequestTimeoutSeconds - 30.0; the same for a call that waits on a Steam backend.

[OnlineServices.Steam.Auth]
; Who verifies the auth ticket a client issues for a host.
;   True  - the game server verifies it itself through BeginVerifiedAuthSession (default).
;   False - the ticket is bound to WebApiIdentity below and only a backend can verify it, through
;           ISteamUserAuth/AuthenticateUserTicket; a game server asked to verify such a ticket refuses.
bVerifyAuthTicketsOnGameServer=True
; Identity a Web API ticket is bound to. The backend has to pass the same string to Steam.
;WebApiIdentity=

