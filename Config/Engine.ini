; something Steam will not report on its own: how full a lobby is, what its join policy is, whether it
; is hosted by a development build and whether it is being torn down. Keeping a service attribute for
; each is what lets the value be read back as a normal lobby attribute; the names match LobbyKeys in
; SteamLobby.h, and follow the naming of the keys Steam fills in itself.
